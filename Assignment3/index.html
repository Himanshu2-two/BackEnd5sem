<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Feedback Form</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Student Feedback Form</h1>

    <form id="feedbackForm">

        <label>Student Name</label>
        <input type="text" id="name">
        <div class="error" id="nameError"></div>

        <label>Email</label>
        <input type="email" id="email">
        <div class="error" id="emailError"></div>

        <label>Course</label>
        <select id="course">
            <option value="">Select Course</option>
            <option>BE CSE</option>
            <option>BE CSE AI</option>
            <option>BCA</option>
            <option>MCA</option>
            <option>M.Tech</option>
        </select>
        <div class="error" id="courseError"></div>

        <label>Feedback</label>
        <textarea id="feedback"></textarea>
        <div class="error" id="feedbackError"></div>

        <button type="submit">Submit Feedback</button>
        <button type="button" id="deleteBtn">Delete Stored Data</button>

    </form>

    <h3 id="sessionUser"></h3>

    <h2>Stored Feedback</h2>

    <div id="displayData">
        No feedback stored.
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
